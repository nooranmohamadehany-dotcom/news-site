<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Convert | Daily Pulse</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-page="convert">
<header id="header"></header>
<main class="wrap ">
<section class="panel convert">
  <h1>Currency converter</h1>
  <div class="row"><input id="amount" type="number" value="1" min="0"><select id="from"></select>
  <button id="swap" title="Swap">⇄</button><select id="to"></select></div>
  <p id="result" class="big"></p><p id="rate" class="muted"></p>
</section>
</main>
<footer id="footer"></footer>
<script src="app.js"></script>
</body>
</html>
